{% extends "base.html" %}{% block content %}<section class="card"><h1>Edit {{ entry.title }}</h1><form method="post" class="grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Experiment code<input name="experiment_code" value="{{ booking.experiment_code }}" required></label><label>Expected minutes<input type="number" name="expected_minutes" min="1" value="{{ booking.expected_minutes }}" required></label><label>Sample category<input name="sample_category" value="{{ booking.sample_category }}" required></label><label>Description<textarea name="description">{{ booking.description }}</textarea></label>{% if user.role == 'admin' %}<label>Administrator notes<textarea name="admin_notes">{{ booking.admin_notes }}</textarea></label>{% endif %}{% if schedule_editable %}<label>New block start (UTC, blank to retain)<input name="new_start" placeholder="2026-08-01T13:00:00Z"></label><label>Consecutive blocks<input type="number" name="block_count" min="1" max="100" value="{{ block_count }}"></label>{% endif %}{% if user.role == 'admin' %}<label>Administrator reason<input name="reason" required></label>{% endif %}<button>Save changes</button></form></section>{% endblock %}
