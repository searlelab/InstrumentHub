{% extends "base.html" %}{% block content %}<section class="card narrow"><h1>Select reservation length</h1><p>Start: {{ slot_start }}</p><p>The selected time will be held for {{ hold_minutes }} minutes. Dates cannot be changed after the hold begins.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="/book/hold"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="instrument_id" value="{{ instrument_id }}"><input type="hidden" name="slot_start" value="{{ slot_start }}"><label>Consecutive blocks<input type="number" name="count" min="1" max="100" value="1" required></label><button>Hold these blocks</button></form></section>{% endblock %}
