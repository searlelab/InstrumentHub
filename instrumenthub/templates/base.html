<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}InstrumentHub{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}"></head>
<body><header><a class="brand" href="/">InstrumentHub</a>{% if user %}<nav><a href="/calendar">Calendar</a><a href="/profile">Profile</a>{% if user.role == 'admin' %}<a href="/admin">Admin</a>{% endif %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Sign out</button></form></nav>{% endif %}</header>
<main>{% if message %}<p class="notice">{{ message }}</p>{% endif %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', path='/app.js') }}" defer></script></body></html>
