{% extends "base.html" %}{% block content %}<section><h1>Book held instrument time</h1><p class="warning" data-hold-expires="{{ hold.expires_at }}">Hold expires at {{ hold.expires_at }}. <span data-countdown></span></p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<p>Reserved blocks: {{ slots[0].slot_start }} – {{ slots[-1].slot_end }} ({{ reserved_minutes }} nominal minutes).</p><p class="warning" data-reservation-warning hidden></p><div data-rule-preview aria-live="polite"></div><form method="post" action="/book/submit" class="grid-form" data-booking-wizard data-hold-id="{{ hold.id }}" data-csrf-token="{{ csrf_token }}" data-reserved-minutes="{{ reserved_minutes }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="hold_id" value="{{ hold.id }}"><input type="hidden" name="instrument_id" value="{{ instrument_id }}"><label>PI<select name="pi_id" required>{% for item in pis %}<option value="{{ item.id }}" {% if saved.get('pi_id') == item.id|string %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><label>Project<select name="project_id" required>{% for item in projects %}<option value="{{ item.id }}" {% if saved.get('project_id') == item.id|string %}selected{% endif %}>{{ item.code }} — {{ item.name }}</option>{% endfor %}</select></label><label>Grant (optional)<select name="grant_id"><option value="">None</option>{% for item in grants %}<option value="{{ item.id }}" {% if saved.get('grant_id') == item.id|string %}selected{% endif %}>{{ item.number }}</option>{% endfor %}</select></label><label>Experiment name or code<input name="experiment_code" value="{{ saved.get('experiment_code','') }}" required></label><label>Expected minutes<input type="number" name="expected_minutes" min="1" value="{{ saved.get('expected_minutes','') }}"></label><label>Or injection count<input type="number" name="injection_count" min="1" value="{{ saved.get('injection_count','') }}"></label><label>Gradient minutes<input type="number" name="gradient_minutes" min="1" value="{{ saved.get('gradient_minutes','') }}"></label><p data-duration-estimate></p><label>Sample category<input name="sample_category" value="{{ saved.get('sample_category','') }}" required></label><label>Column setup<input name="column_setup" value="{{ saved.get('column_setup','') }}"></label><label class="checkbox"><input type="checkbox" name="libraries_present" value="yes" {% if saved.get('libraries_present') %}checked{% endif %}> Libraries present</label><label class="span-2">Description<textarea name="description">{{ saved.get('description','') }}</textarea></label><label class="span-2">Notes for administrators<textarea name="admin_notes">{{ saved.get('admin_notes','') }}</textarea></label><label class="checkbox span-2"><input type="checkbox" name="override_required" value="yes" {% if saved.get('override_required') %}checked{% endif %}> Request administrator override</label><button>Evaluate and submit</button></form></section>{% endblock %}
