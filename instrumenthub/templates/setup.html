{% extends "base.html" %}{% block content %}<h1>Initial lab setup</h1><p>Booking stays locked until this form is complete. Set up one instrument and its shared calendar class now; administrators can add further instruments later.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Timezone<input name="timezone" value="America/Chicago" required></label><label>Hold minutes <span class="help" title="How long selected time remains reserved while the user completes a booking." aria-label="Help: hold duration">?</span><input type="number" name="hold_minutes" min="5" max="60" value="15" required></label><label>Tentative expiry days (blank disables) <span class="help" title="Tentative bookings need administrator approval. Set days to automatically cancel unapproved requests after that time; leave blank to keep them until a decision." aria-label="Help: tentative expiry">?</span><input type="number" name="tentative_expiration_days" min="1"></label><fieldset><legend>Initial instrument</legend><label>Name<input name="instrument_name" required></label><label>Instrument class<input name="instrument_class_name" value="Mass Spectrometer" required></label><label><input type="checkbox" name="instrument_training" value="yes"> Enforce training <span class="help" title="Users need a current training record for this instrument before they can submit a booking." aria-label="Help: enforce training">?</span></label></fieldset><button>Complete setup</button></form>{% endblock %}
