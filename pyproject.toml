[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instrumenthub"
version = "0.1.0"
description = "Intranet mass spectrometer scheduler"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "tzdata==2026.3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["instrumenthub*"]

[tool.setuptools.package-data]
instrumenthub = ["migrations/*.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
